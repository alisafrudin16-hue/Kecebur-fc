
<!-- MULAI: SKUAD KECEBUR FC -->
<style>
  #skuad-kecebur {
    background: #07162e;
    color: #fff;
    padding: 60px 20px;
    font-family: Arial, sans-serif;
  }

  #skuad-kecebur * {
    box-sizing: border-box;
  }

  #skuad-kecebur .judul-skuad {
    text-align: center;
    margin-bottom: 35px;
  }

  #skuad-kecebur .judul-skuad h2 {
    color: #fff;
    font-size: 32px;
    margin-bottom: 10px;
  }

  #skuad-kecebur .judul-skuad p {
    color: #b8c6db;
  }

  #skuad-kecebur .daftar-pemain {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(190px, 1fr));
    gap: 20px;
  }

  #skuad-kecebur .kartu-pemain {
    background: #142b4d;
    border: 1px solid #294469;
    border-radius: 15px;
    overflow: hidden;
    transition: transform .2s ease;
  }

  #skuad-kecebur .kartu-pemain:hover {
    transform: translateY(-5px);
  }

  #skuad-kecebur .kartu-pemain img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    background: #213a5d;
  }

  #skuad-kecebur .info-pemain {
    text-align: center;
    padding: 16px;
  }

  #skuad-kecebur .nomor {
    font-size: 26px;
    font-weight: bold;
    color: #f5cb58;
  }

  #skuad-kecebur .info-pemain h3 {
    color: #fff;
    margin: 8px 0;
    font-size: 20px;
  }

  #skuad-kecebur .info-pemain p {
    color: #c0cde0;
    margin: 0;
    font-size: 14px;
  }

  @media (max-width: 480px) {
    #skuad-kecebur .daftar-pemain {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    #skuad-kecebur .info-pemain {
      padding: 12px 6px;
    }

    #skuad-kecebur .info-pemain h3 {
      font-size: 17px;
    }
  }
</style>

<section id="skuad-kecebur">
  <div class="judul-skuad">
    <h2>SKUAD KECEBUR FC</h2>
    <p>Satu Tim, Satu Keluarga</p>
  </div>

  <div class="daftar-pemain" id="daftar-kecebur">
  </div>
</section>

<script>
(function () {
  const pemain = [
    ["Rehan", 1, "GK", 14],
    ["Ifan", 2, "CB", 11],
    ["Doni", 4, "CB", 8],
    ["Ali", 20, "LB", 12],
    ["Riski", 3, "RB", 1],
    ["Sigit", 6, "DM", 9],
    ["Riyan", 11, "CM", 15],
    ["Akbar", 13, "CM", 10],
    ["Adit", 12, "CM", 7],
    ["Abas", 8, "CM", 6],
    ["Rindho", 10, "CM", 4],
    ["Ogy", 7, "CF", 2],
    ["Agung", 5, "CM", 5]
  ];

  const daftar = document.getElementById(
    "daftar-kecebur"
  );

  if (!daftar) return;

  pemain.forEach(([nama, nomor, posisi, foto]) => {
    const kartu = document.createElement("article");
    kartu.className = "kartu-pemain";

    const gambar = document.createElement("img");
    gambar.src = `https://alisafrudin16-hue.github.io/Kecebur-fc/assets/pemain_(${foto}).jpeg`;
    gambar.alt = `Foto ${nama}`;
    gambar.loading = "lazy";

    const info = document.createElement("div");
    info.className = "info-pemain";

    const nomorEl = document.createElement("div");
    nomorEl.className = "nomor";
    nomorEl.textContent = `#${nomor}`;

    const namaEl = document.createElement("h3");
    namaEl.textContent = nama;

    const posisiEl = document.createElement("p");
    posisiEl.textContent = posisi;

    info.append(nomorEl, namaEl, posisiEl);
    kartu.append(gambar, info);
    daftar.appendChild(kartu);
  });
})();
</script>
<!-- SELESAI: SKUAD KECEBUR FC -->
